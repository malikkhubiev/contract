<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Shared Stance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8efe8;
      --bg-soft: #f3f7f3;
      --ink: #1c2a22;
      --muted: #5a6b60;
      --line: #c5d4c8;
      --card: rgba(255, 255, 255, 0.72);
      --accent: #2f6b4f;
      --accent-soft: #d7ebe0;
      --shadow: 0 10px 30px rgba(28, 42, 34, 0.06);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Literata", Georgia, serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #f7fbf7 0%, transparent 55%),
        linear-gradient(180deg, #dfe9e1 0%, var(--bg) 35%, #edf3ed 100%);
      line-height: 1.65;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(243, 247, 243, 0.85);
      border-bottom: 1px solid var(--line);
      padding: 0.85rem 1rem;
    }

    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
    }

    .lang-switch button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      color: var(--muted);
      font-family: "Manrope", sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .lang-switch button:hover {
      color: var(--ink);
      border-color: #9fb7a8;
    }

    .lang-switch button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    main {
      width: min(760px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }

    header.page-header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    header.page-header h1 {
      font-family: "Manrope", sans-serif;
      font-weight: 700;
      font-size: clamp(1.55rem, 4vw, 2.1rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.55rem;
    }

    header.page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 1.02rem;
    }

    nav.toc {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 2rem;
    }

    nav.toc a {
      font-family: "Manrope", sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
    }

    section {
      margin-bottom: 2.1rem;
    }

    section h2 {
      font-family: "Manrope", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.9rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid var(--line);
    }

    article {
      background: var(--card);
      border: 1px solid rgba(197, 212, 200, 0.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.15rem 1.1rem;
      margin-bottom: 0.75rem;
    }

    article h3 {
      font-family: "Manrope", sans-serif;
      font-size: 1.02rem;
      font-weight: 700;
      margin: 0 0 0.35rem;
      letter-spacing: -0.01em;
    }

    article p {
      margin: 0;
      color: #24362c;
      font-size: 1.02rem;
    }

    .label {
      display: inline-block;
      font-family: "Manrope", sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2rem;
    }

    @media (max-width: 520px) {
      article { padding: 0.9rem 0.95rem; }
      article p { font-size: 0.98rem; }
    }
  </style>
</head>

      <p id="subtitle"></p>
    </header>

    <div id="content"></div>
    <footer id="footer"></footer>
  </main>

    const titleEl = document.getElementById("title");
    const subtitleEl = document.getElementById("subtitle");
    const tocEl = document.getElementById("toc");
    const contentEl = document.getElementById("content");
    const footerEl = document.getElementById("footer");
    const buttons = document.querySelectorAll(".lang-switch button");

    function render(lang) {
      const pack = DATA[lang];
      document.documentElement.lang = lang;
      document.title = pack.title;
      titleEl.textContent = pack.title;
      subtitleEl.textContent = pack.subtitle;
      footerEl.textContent = pack.footer;

      tocEl.innerHTML = pack.sections
        .map((s) => `<a href="#${s.id}">${s.name}</a>`)
        .join("");

      contentEl.innerHTML = pack.sections
        .map((section) => {
          const articles = section.items
            .map(
              ([q, a]) => `
            <article>
              <div class="label">${pack.q}</div>
              <h3>${q}</h3>
              <div class="label">${pack.a}</div>
              <p>${a}</p>
            </article>`
            )
            .join("");
          return `<section id="${section.id}"><h2>${section.name}</h2>${articles}</section>`;
        })
        .join("");

      buttons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      try {
        localStorage.setItem("stance-lang", lang);
      } catch (_) {}
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => render(btn.dataset.lang));
    });

    let start = "en";
    try {
      const saved = localStorage.getItem("stance-lang");
      if (saved && DATA[saved]) start = saved;
    } catch (_) {}
    render(start);
  </script>
